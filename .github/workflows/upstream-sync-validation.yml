name: Upstream sync validation

on:
  push:
    branches:
      - validation/upstream-sync-2026-09-10

permissions:
  contents: read

concurrency:
  group: upstream-sync-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository == 'XiaoDaoJiang/easy-yapi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a386d3fb3aabd921934a645a5cc121c463bfb3c7
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and bundle original Git histories
        shell: bash
        run: |
          set -euo pipefail
          F=a386d3fb3aabd921934a645a5cc121c463bfb3c7
          I=32538430a5db59e1a096d5b359304f044feecfa6
          U0=62e309710e07c00c8d3fd9e2ec159c179eea1517
          U1=3154e8fe96225bfdfe1ed542e6047d3d27ba2147
          git fetch --no-tags https://github.com/tangcent/easy-yapi.git refs/heads/master:refs/remotes/upstream/master
          test "$(git rev-parse origin/master)" = "$F"
          test "$(git rev-parse refs/remotes/upstream/master)" = "$U1"
          git merge-base --is-ancestor "$I" "$F"
          git merge-base --is-ancestor "$U0" "$U1"
          test "$(git rev-parse "$I^{tree}")" = "$(git rev-parse "$U0^{tree}")"
          test "$(git rev-list --count "$U0..$U1")" = 18
          git update-ref refs/heads/frozen-fork "$F"
          git update-ref refs/heads/frozen-upstream "$U1"
          mkdir -p validation-evidence
          git bundle create validation-evidence/easy-yapi-frozen.bundle refs/heads/frozen-fork refs/heads/frozen-upstream
          git bundle verify validation-evidence/easy-yapi-frozen.bundle
          git diff --name-status "$I" "$F" > validation-evidence/fork-delta.txt
          git diff --name-status "$U0" "$U1" > validation-evidence/upstream-delta.txt
          git log --oneline "$U0..$U1" > validation-evidence/upstream-commits.txt
      - uses: actions/upload-artifact@v7
        with:
          name: frozen-git-history
          path: validation-evidence/
          retention-days: 7
          if-no-files-found: error

  baseline:
    if: github.repository == 'XiaoDaoJiang/easy-yapi'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a386d3fb3aabd921934a645a5cc121c463bfb3c7
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            17
            21
          cache: gradle
      - name: Baseline tests and default plugin build
        shell: pwsh
        run: |
          if ($IsWindows) {
            & .\gradlew.bat test buildPlugin --stacktrace
          } else {
            & ./gradlew test buildPlugin --stacktrace
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload baseline reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-${{ matrix.os }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 7
          if-no-files-found: warn
