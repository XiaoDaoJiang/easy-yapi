name: Upstream sync validation

on:
  push:
    branches:
      - validation/upstream-sync-2026-09-10

permissions:
  contents: read

concurrency:
  group: upstream-sync-validation-${{ github.sha }}
  cancel-in-progress: false

env:
  FORK_MASTER: eb3897b42af032b1b8d26bc0af5ad8b2b1f6cde6
  PREVIOUS_HEAD: 2f25bdf6cedb4e3d01b7258d0ac25d8e428b9ae1
  UPSTREAM: 3154e8fe96225bfdfe1ed542e6047d3d27ba2147

jobs:
  snapshot:
    if: github.repository == 'XiaoDaoJiang/easy-yapi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_MASTER }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze current master and existing sync history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/master)" = "$FORK_MASTER"
          test "$(git rev-parse origin/sync/upstream-master-2026-09-10)" = "$PREVIOUS_HEAD"
          git merge-base --is-ancestor a386d3fb3aabd921934a645a5cc121c463bfb3c7 "$FORK_MASTER"
          git merge-base --is-ancestor "$UPSTREAM" "$PREVIOUS_HEAD"
          git update-ref refs/heads/frozen-master "$FORK_MASTER"
          git update-ref refs/heads/frozen-sync "$PREVIOUS_HEAD"
          mkdir -p validation-evidence
          git bundle create validation-evidence/master-refresh.bundle refs/heads/frozen-master refs/heads/frozen-sync
          git bundle verify validation-evidence/master-refresh.bundle
          git diff --name-status a386d3fb3aabd921934a645a5cc121c463bfb3c7 "$FORK_MASTER" > validation-evidence/new-master-delta.txt
          git log --oneline a386d3fb3aabd921934a645a5cc121c463bfb3c7.."$FORK_MASTER" > validation-evidence/new-master-commits.txt
          set +e
          git merge-tree --write-tree --name-only "$PREVIOUS_HEAD" "$FORK_MASTER" > validation-evidence/merge-preview.txt
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          echo "merge-preview-exit=$code"
          cat validation-evidence/merge-preview.txt
      - uses: actions/upload-artifact@v7
        with:
          name: master-refresh-history
          path: validation-evidence/
          retention-days: 7
          if-no-files-found: error

  baseline:
    if: github.repository == 'XiaoDaoJiang/easy-yapi'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_MASTER }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            17
            21
          cache: gradle
      - name: Test and build current master
        shell: pwsh
        run: |
          $wrapper = if ($IsWindows) { '.\gradlew.bat' } else { './gradlew' }
          & $wrapper test buildPlugin --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload current master baseline reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: refreshed-baseline-${{ matrix.os }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 7
          if-no-files-found: warn
