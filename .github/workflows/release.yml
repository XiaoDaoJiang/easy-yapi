name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'XiaoDaoJiang/easy-yapi'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: zulu
          cache: gradle

      - name: Validate release version
        id: version
        shell: bash
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Release tag must point to a commit contained in master"
            exit 1
          fi

          FULL_VERSION=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.gradle.kts | head -n 1)
          RELEASE_VERSION=$(printf '%s' "$FULL_VERSION" | sed -nE 's/^([0-9]+\.[0-9]+\.[0-9]+)(\..*)?$/\1/p')

          if [ -z "$FULL_VERSION" ] || [ -z "$RELEASE_VERSION" ]; then
            echo "Unable to read a valid version from build.gradle.kts"
            exit 1
          fi

          if [ "v${RELEASE_VERSION}" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $FULL_VERSION (expected v${RELEASE_VERSION})"
            exit 1
          fi

          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and build plugin
        run: ./gradlew test buildPlugin --stacktrace

      - name: Verify release archive
        shell: bash
        run: |
          ARCHIVE="build/distributions/easy-yapi-${{ steps.version.outputs.full_version }}.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Release archive not found: $ARCHIVE"
            exit 1
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: build/distributions/easy-yapi-${{ steps.version.outputs.full_version }}.zip
