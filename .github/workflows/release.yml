name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPAT_SINCE: '221'
  COMPAT_UNTIL: '251'

jobs:
  release:
    if: github.repository == 'XiaoDaoJiang/easy-yapi'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: zulu
          cache: gradle

      - name: Validate release version
        id: version
        shell: bash
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Release tag must point to a commit contained in master"
            exit 1
          fi

          BASE_VERSION=$(sed -n 's/^pluginBaseVersion=//p' gradle.properties | head -n 1 | tr -d '[:space:]')
          SINCE_BUILD=$(sed -n 's/^pluginSinceBuild=//p' gradle.properties | head -n 1 | tr -d '[:space:]')
          UNTIL_BUILD=$(sed -n 's/^pluginUntilBuild=//p' gradle.properties | head -n 1 | tr -d '[:space:]')
          UNTIL_BUILD=${UNTIL_BUILD:-0}

          if [ -z "$BASE_VERSION" ] || [ -z "$SINCE_BUILD" ]; then
            echo "Unable to read pluginBaseVersion/pluginSinceBuild from gradle.properties"
            exit 1
          fi

          FULL_VERSION="${BASE_VERSION}.${SINCE_BUILD}.${UNTIL_BUILD}"
          if [ "v${BASE_VERSION}" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project base version $BASE_VERSION (expected v${BASE_VERSION})"
            exit 1
          fi

          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and build default plugin
        run: ./gradlew test buildPlugin --stacktrace

      - name: Upload test failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ github.run_attempt }}
          path: build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Build compatibility package
        shell: bash
        run: |
          echo "Building best-effort compatibility package for IDEA builds ${COMPAT_SINCE}-${COMPAT_UNTIL}"
          ./gradlew buildPlugin \
            -PpluginSinceBuild="$COMPAT_SINCE" \
            -PpluginUntilBuild="$COMPAT_UNTIL" \
            --stacktrace \
            || echo "::warning::Compatibility build failed — releasing the validated default package only"

      - name: Verify default release archive
        shell: bash
        run: |
          ARCHIVE="build/distributions/easy-yapi-${{ steps.version.outputs.full_version }}.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Release archive not found: $ARCHIVE"
            exit 1
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: build/distributions/easy-yapi-${{ steps.version.outputs.base_version }}.*.zip
